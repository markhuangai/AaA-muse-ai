server:
  listen: "0.0.0.0:8080"
database:
  url: "postgres://aaa_muse@database:5432/aaa_muse?sslmode=disable"
  password: "${POSTGRES_PASSWORD}"
management:
  key: "${MUSE_MANAGEMENT_KEY}"
control-portal:
  password: "${MUSE_PORTAL_PASSWORD}"
client-keys: {}
limits:
  in-flight-per-worker: 1
diagnostics:
  level: info
  directory: /var/lib/aaa-muse-ai/diagnostics
  retention-days: 7
  max-bytes: 134217728
