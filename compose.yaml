name: aaa-muse-qualification
services:
  service:
    image: ${MUSE_SERVICE_IMAGE:?Set the verified paired-release image digest}
    restart: unless-stopped
    ports:
      - "${MUSE_BIND_ADDRESS:-127.0.0.1}:${MUSE_HTTP_PORT:-8081}:8080"
    environment:
      MUSE_PUBLIC_URL: ${MUSE_PUBLIC_URL:?Set the qualification HTTPS origin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
      MUSE_MANAGEMENT_KEY: ${MUSE_MANAGEMENT_KEY:?Set a management key}
      MUSE_PORTAL_PASSWORD: ${MUSE_PORTAL_PASSWORD:?Set a distinct portal password}
      MUSE_CLIENT_KEY_A: ${MUSE_CLIENT_KEY_A:?Set the first client key}
      MUSE_CLIENT_KEY_B: ${MUSE_CLIENT_KEY_B:?Set the second client key}
    volumes:
      - type: bind
        source: ./config.yaml
        target: /etc/aaa-muse-ai/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - diagnostics:/var/lib/aaa-muse-ai/diagnostics
      - media:/var/lib/aaa-muse-ai/media
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  database:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_DB: aaa_muse
      POSTGRES_USER: aaa_muse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aaa_muse -d aaa_muse"]
      interval: 2s
      timeout: 2s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  database:
  diagnostics:
  media:
