name: aaa-muse-qualification
services:
  service:
    image: ${MUSE_SERVICE_IMAGE:?Set the verified paired-release image digest}
    restart: unless-stopped
    ports:
      - "${MUSE_BIND_ADDRESS:-127.0.0.1}:${MUSE_HTTP_PORT:-8081}:8080"
    environment:
      MUSE_MANAGEMENT_KEY: ${MUSE_MANAGEMENT_KEY:?Set a management key}
      MUSE_PORTAL_PASSWORD: ${MUSE_PORTAL_PASSWORD:?Set a distinct portal password}
      MUSE_CLIENT_KEY_A: ${MUSE_CLIENT_KEY_A:-}
      MUSE_CLIENT_KEY_B: ${MUSE_CLIENT_KEY_B:-}
    volumes:
      - type: bind
        source: ./config
        target: /etc/aaa-muse-ai
        bind:
          create_host_path: false
      - sqlite:/var/lib/aaa-muse-ai/state
      - diagnostics:/var/lib/aaa-muse-ai/diagnostics
      - media:/var/lib/aaa-muse-ai/media
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  sqlite:
  diagnostics:
  media:
