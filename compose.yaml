name: muse-ai-proxy
services:
  service:
    image: ghcr.io/markhuangai/aaa-muse-ai:latest
    user: '0:0'
    command: [serve]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - type: bind
        source: ./config
        target: /etc/aaa-muse-ai
        bind:
          create_host_path: true
      - type: bind
        source: ./sqlite
        target: /var/lib/aaa-muse-ai/state
        bind:
          create_host_path: true
      - type: bind
        source: ./media
        target: /var/lib/aaa-muse-ai/media
        bind:
          create_host_path: true
      - diagnostics:/var/lib/aaa-muse-ai/diagnostics
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  diagnostics:
