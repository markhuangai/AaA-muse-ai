services:
  service:
    volumes:
      - sqlite:/var/lib/aaa-muse-ai/state
      - media:/var/lib/aaa-muse-ai/media
volumes:
  sqlite:
    external: true
    name: ${MUSE_SQLITE_VOLUME:?Set the verified existing SQLite volume name}
  media:
    external: true
    name: ${MUSE_MEDIA_VOLUME:?Set the verified existing media volume name}
