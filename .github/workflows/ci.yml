name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  workflow-policy:
    name: CI / workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install policy dependencies
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Install verified actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/aaa-muse-actionlint"
          mkdir -p "${tool_dir}"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "${tool_dir}/actionlint.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${tool_dir}/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "${tool_dir}/actionlint.tar.gz" -C "${tool_dir}" actionlint
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"
      - name: Test production policies
        run: node --test .github/scripts/*.test.mjs
      - name: Enforce runner and timeout policy
        run: make check-ci-policy
      - name: Lint workflows
        run: make check-workflows

  service:
    name: CI / service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Check service
        run: make check-service
      - name: Unit statements and race checks
        run: make test-service-unit
      - name: Real HTTP and PostgreSQL integration
        run: make test-service
      - name: Worker enrollment, revocation, and diagnosis
        run: make test-worker-auth
      - name: Inference turns, SSE health, and client-tool continuation
        run: make test-inference

  image:
    name: CI / image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Packaged startup and diagnostic failures
        run: make smoke-image

  worker:
    name: CI / worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install locked worker development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check worker types
        run: npm run check --workspace worker
      - name: Worker unit statement coverage
        run: npm test --workspace worker
      - name: Packed CLI with real HTTPS, SSE and PostgreSQL
        run: make test-worker-transport

  worker-package:
    name: CI / worker-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify Node 24 archive
        run: make worker-package
      - name: Shipped installer, hook, recovery and protected diagnostics
        run: make test-worker-setup
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Verify the same compiled package on the minimum runtime
        run: npm run test:package --workspace worker -- --verify-receipt .artifacts/worker-package/latest.json
      - name: Exercise production worker logic on the minimum runtime
        working-directory: worker
        run: node --test test/*.test.mjs
