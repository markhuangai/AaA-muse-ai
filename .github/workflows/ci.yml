name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  standards:
    name: CI / standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      components: ${{ steps.components.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Enforce maintained-file inventory and line limits
        run: make check-file-sizes
      - name: Select every implemented unit component
        id: components
        run: |
          set -euo pipefail
          components=$(node tools/unit-runner.mjs list)
          printf 'components=%s\n' "$components" >> "$GITHUB_OUTPUT"

  unit:
    name: CI / unit (${{ matrix.component }})
    needs: standards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.standards.outputs.components) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install locked unit dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Build existing diagnostic modules
        run: npm run build --workspace worker
      - name: Run the selected real-logic unit suite and coverage policy
        env:
          UNIT_COMPONENT: ${{ matrix.component }}
        run: node tools/unit-runner.mjs "$UNIT_COMPONENT"
      - name: Retain complete safe unit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-${{ env.SOURCE_SHA }}-${{ matrix.component }}-${{ github.run_attempt }}
          path: .artifacts/ci/unit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: CI / coverage
    needs: [standards, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Download unit reports for this source and run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-${{ env.SOURCE_SHA }}-*
          path: .artifacts/downloaded-unit
      - name: Require every expected unit shard and raw report
        if: always()
        env:
          STANDARDS_RESULT: ${{ needs.standards.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          set -euo pipefail
          node tools/coverage-policy.mjs aggregate .artifacts/downloaded-unit
          test "$STANDARDS_RESULT" = success
          test "$UNIT_RESULT" = success

  qualification:
    name: CI / qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install locked helper dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build existing diagnostic helpers
        run: npm run build --workspace worker
      - name: Validate explicit synthetic receipts without qualifying Muse
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/aaa-muse-qualification-synthetic"
          node tools/qualification-fixtures.mjs "$fixture_dir"
          node tools/qualify.mjs validate-report --report "$fixture_dir/report.json" --synthetic

  workflow-policy:
    name: CI / workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install policy dependencies
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Install verified actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/aaa-muse-actionlint"
          mkdir -p "${tool_dir}"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "${tool_dir}/actionlint.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${tool_dir}/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "${tool_dir}/actionlint.tar.gz" -C "${tool_dir}" actionlint
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"
      - name: Enforce runner and timeout policy
        run: make check-ci-policy
      - name: Lint workflows
        run: make check-workflows

  service:
    name: CI / service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Install locked diagnostic decoder dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check service
        run: make check-service
      - name: Real HTTP and PostgreSQL integration
        run: make test-service
      - name: Worker enrollment, revocation, and diagnosis
        run: make test-worker-auth
      - name: Inference turns, SSE health, and client-tool continuation
        run: make test-inference
      - name: Owned canonical history, request timelines and diagnostics
        run: make test-history
      - name: Capability routing, concurrency, affinity and log-only diagnosis
        run: make test-routing
      - name: Broker restart reconciliation, durable receipts and uncertainty
        run: make test-broker-recovery

  image:
    name: CI / image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Packaged startup and diagnostic failures
        run: make smoke-image

  worker:
    name: CI / worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install locked worker development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check worker types
        run: npm run check --workspace worker
      - name: Packed CLI with real HTTPS, SSE and PostgreSQL
        run: make test-worker-transport

  worker-package:
    name: CI / worker-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify Node 24 archive
        run: make worker-package
      - name: Shipped installer, hook, recovery and protected diagnostics
        run: make test-worker-setup
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Verify the same compiled package on the minimum runtime
        run: npm run test:package --workspace worker -- --verify-receipt .artifacts/worker-package/latest.json
      - name: Exercise production worker logic on the minimum runtime
        working-directory: worker
        run: node --test test/*.test.mjs
