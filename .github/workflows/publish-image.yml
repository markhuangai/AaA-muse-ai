name: Publish paired release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: paired-product-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reserve the paired version from verified merged source
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            const { prepareRelease, reportReleaseFailure } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/worker-release.mjs`);
            try {
              const result = await prepareRelease({ github, context, paired: true });
              for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
            } catch (error) { reportReleaseFailure(core, error); }

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: read
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      IMAGE: ghcr.io/markhuangai/aaa-muse-ai
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          registry-url: https://npm.pkg.github.com
      - name: Pack the worker then build and smoke-test the paired image
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          make smoke-image SOURCE_SHA="$SOURCE_SHA" SOURCE_DIRTY=false SERVICE_IMAGE="$IMAGE:$PRODUCT_VERSION"
          docker tag "$IMAGE:$PRODUCT_VERSION" "$IMAGE:sha-$SOURCE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Verify identical worker bytes on the minimum runtime
        working-directory: source
        run: npm run test:package --workspace worker -- --verify-receipt .artifacts/worker-package/latest.json
      - name: Publish and verify the paired worker
        uses: actions/github-script@v9
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { publishRelease, reportReleaseFailure } = await import(`${process.env.GITHUB_WORKSPACE}/trusted/.github/scripts/worker-release.mjs`);
            const prepared = { source_sha: process.env.SOURCE_SHA, version: process.env.PRODUCT_VERSION, tag: process.env.RELEASE_TAG, should_publish: true, paired: true };
            try {
              const receipt = JSON.parse(readFileSync('source/.artifacts/worker-package/latest.json', 'utf8'));
              await publishRelease({ github, context, prepared, receipt, archive: readFileSync(receipt.archive), token: process.env.NODE_AUTH_TOKEN });
            } catch (error) { reportReleaseFailure(core, error, prepared); }
      - name: Publish absent immutable image tags and verify the complete pair
        uses: actions/github-script@v9
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { execFileSync } = await import('node:child_process');
            const { imageConfigDigest, registryManifest, resolvePublication } = await import(`${process.env.GITHUB_WORKSPACE}/trusted/.github/scripts/image-policy.mjs`);
            const { finalizeProductRelease } = await import(`${process.env.GITHUB_WORKSPACE}/trusted/.github/scripts/product-release.mjs`);
            const { inspectWorker } = await import(`${process.env.GITHUB_WORKSPACE}/trusted/.github/scripts/release-manifest.mjs`);
            const { reportReleaseFailure } = await import(`${process.env.GITHUB_WORKSPACE}/trusted/.github/scripts/worker-release.mjs`);
            const prepared = { source_sha: process.env.SOURCE_SHA, version: process.env.PRODUCT_VERSION, tag: process.env.RELEASE_TAG, paired: true };
            try {
              if (await resolvePublication({ github, context }) !== prepared.source_sha) throw new Error('publication_source_changed');
              const inspected = JSON.parse(execFileSync('docker', ['image', 'inspect', `${process.env.IMAGE}:${prepared.version}`], { encoding: 'utf8' }))[0];
              if (inspected.Config.Labels['org.opencontainers.image.version'] !== prepared.version || inspected.Config.Labels['org.opencontainers.image.revision'] !== prepared.source_sha) throw new Error('publication_image_identity_mismatch');
              const expectedConfig = imageConfigDigest(inspected);
              const tags = [prepared.version, `sha-${prepared.source_sha}`];
              const destinations = await Promise.all(tags.map(tag => registryManifest({ token: process.env.REGISTRY_TOKEN, image: 'markhuangai/aaa-muse-ai', tag, expectedConfig })));
              if (destinations.some(result => !result.exists)) execFileSync('docker', ['login', 'ghcr.io', '--username', process.env.GITHUB_ACTOR, '--password-stdin'], { input: process.env.REGISTRY_TOKEN, stdio: ['pipe', 'ignore', 'ignore'] });
              for (let index = 0; index < tags.length; index++) if (!destinations[index].exists) execFileSync('docker', ['push', `${process.env.IMAGE}:${tags[index]}`], { stdio: 'inherit' });
              const receipt = JSON.parse(readFileSync('source/.artifacts/worker-package/latest.json', 'utf8'));
              const worker = { ...receipt, ...inspectWorker(receipt.archive) };
              const treeSHA = execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
              await finalizeProductRelease({ github, context, prepared, worker, image: { source_sha: prepared.source_sha, tree_sha: treeSHA, version: prepared.version, image_config_digest: expectedConfig, worker_sha256: worker.sha256 }, token: process.env.REGISTRY_TOKEN });
            } catch (error) { reportReleaseFailure(core, error, { ...prepared, outcome: 'incomplete' }); }
