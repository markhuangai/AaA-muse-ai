name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: Exact latest paired prerelease tag (vX.Y.Z-rc.N)
        required: true
        type: string
      stable_version:
        description: Stable version to publish (X.Y.Z)
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: paired-product-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      prepared: ${{ steps.resolve.outputs.prepared }}
      resume_run_id: ${{ steps.resolve.outputs.resume_run_id }}
      resume_artifact_id: ${{ steps.resolve.outputs.resume_artifact_id }}
      recovery_only: ${{ steps.resolve.outputs.recovery_only }}
      candidate_ready: ${{ steps.resolve.outputs.candidate_ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v9
        id: resolve
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          STABLE_VERSION: ${{ inputs.stable_version }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { prepareStableRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-control.mjs`);
            const { reportReleaseFailure } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/worker-release.mjs`);
            try {
              const prepared = await prepareStableRelease({ github, context, prereleaseTag: process.env.PRERELEASE_TAG,
                version: process.env.STABLE_VERSION, token: process.env.NODE_AUTH_TOKEN });
              core.setOutput('source_sha', prepared.source_sha);
              core.setOutput('version', prepared.version);
              core.setOutput('prepared', JSON.stringify(prepared));
              core.setOutput('resume_run_id', prepared.resume_run_id ?? '');
              core.setOutput('resume_artifact_id', prepared.resume_artifact_id ?? '');
              core.setOutput('recovery_only', String(prepared.recovery_only === true));
              core.setOutput('candidate_ready', String(prepared.candidate_ready));
            } catch (error) { reportReleaseFailure(core, error); }

  build:
    name: Build final candidate ${{ needs.resolve.outputs.version }} from ${{ needs.resolve.outputs.source_sha }}
    needs: resolve
    if: needs.resolve.outputs.candidate_ready == 'false' && needs.resolve.outputs.resume_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      TREE_SHA: ${{ fromJSON(needs.resolve.outputs.prepared).tree_sha }}
      PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Build and smoke-test final-version bytes once
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          make smoke-image SOURCE_SHA="$SOURCE_SHA" SOURCE_DIRTY=false PRODUCT_VERSION="$PRODUCT_VERSION" SERVICE_IMAGE=aaa-muse-stable:prepared
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Verify the same worker on minimum Node
        working-directory: source
        run: npm run test:package --workspace worker -- --verify-receipt .artifacts/worker-package/latest.json
      - name: Freeze original image and worker bytes before any publication
        working-directory: source
        env:
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
          PREPARED_RELEASE: ${{ needs.resolve.outputs.prepared }}
        run: |
          node --input-type=module <<'JS'
          import { freezeBundle } from '../trusted/.github/scripts/release-bundle.mjs';
          const result = freezeBundle(process.env.BUNDLE_DIR, JSON.parse(process.env.PREPARED_RELEASE));
          console.log(JSON.stringify({ event: 'product.release.bundle_frozen', ...result }));
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ needs.resolve.outputs.version }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Verify removal of the owned local build image
        if: always()
        run: |
          if docker image inspect aaa-muse-stable:prepared >/dev/null 2>&1; then
            docker image rm --no-prune aaa-muse-stable:prepared >/dev/null
          fi
          test -z "$(docker image ls -q aaa-muse-stable:prepared)"
          printf '%s\n' '{"level":"INFO","event":"product.release.runner_cleanup","image_tag":"aaa-muse-stable:prepared","outcome":"removed_or_absent","remote_artifacts_retained":true}'

  publish:
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.candidate_ready == 'false' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.resolve.outputs.resume_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      manifest_sha256: ${{ steps.publish.outputs.manifest_sha256 }}
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          registry-url: https://npm.pkg.github.com
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.resolve.outputs.resume_artifact_id == '' && format('release-bundle-{0}-{1}', needs.resolve.outputs.version, needs.resolve.outputs.source_sha) || '' }}
          artifact-ids: ${{ needs.resolve.outputs.resume_artifact_id }}
          path: ${{ runner.temp }}/release-bundle
          run-id: ${{ needs.resolve.outputs.resume_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Reconcile and publish only missing identical destinations
        id: publish
        uses: actions/github-script@v9
        env:
          PREPARED_RELEASE: ${{ needs.resolve.outputs.prepared }}
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
          NODE_AUTH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { mkdirSync, writeFileSync } = await import('node:fs');
            const { publishCandidate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-candidate.mjs`);
            const { reportReleaseFailure } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/worker-release.mjs`);
            try {
              const prepared = JSON.parse(process.env.PREPARED_RELEASE);
              const receipt = await publishCandidate({ github, context, prepared, directory: process.env.BUNDLE_DIR, token: process.env.NODE_AUTH_TOKEN });
              mkdirSync('.artifacts/ci/release', { recursive: true });
              writeFileSync('.artifacts/ci/release/candidate.json', JSON.stringify(receipt));
            core.setOutput('manifest_sha256', receipt.manifest_sha256);
            } catch (error) { reportReleaseFailure(core, error); }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/release/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify owned local image cleanup and retain published bytes
        if: always()
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for image in aaa-muse-stable:prepared "ghcr.io/markhuangai/aaa-muse-ai:candidate-$PRODUCT_VERSION" "ghcr.io/markhuangai/aaa-muse-ai:sha-$SOURCE_SHA-$PRODUCT_VERSION"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm --no-prune "$image" >/dev/null
            fi
            test -z "$(docker image ls -q "$image")"
          done
          docker logout ghcr.io >/dev/null 2>&1
          printf '%s\n' '{"level":"INFO","event":"product.release.runner_cleanup","outcome":"removed_or_absent","remote_artifacts_retained":true}'

  promote:
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.recovery_only != 'true' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.resolve.outputs.candidate_ready == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          registry-url: https://npm.pkg.github.com
      - name: Publish stable from the verified final-version pair
        uses: actions/github-script@v9
        env:
          PREPARED_RELEASE: ${{ needs.resolve.outputs.prepared }}
          MANIFEST_SHA256: ${{ needs.publish.outputs.manifest_sha256 || fromJSON(needs.resolve.outputs.prepared).manifest_sha256 }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { promoteStable } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-promote.mjs`);
            const { reportReleaseFailure } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/worker-release.mjs`);
            try {
              const prepared = JSON.parse(process.env.PREPARED_RELEASE);
              await promoteStable({ github, context, prepared, manifestSHA256: process.env.MANIFEST_SHA256,
                token: process.env.NODE_AUTH_TOKEN });
            } catch (error) { reportReleaseFailure(core, error); }
      - name: Remove the runner's registry authentication
        if: always()
        run: docker logout ghcr.io >/dev/null
